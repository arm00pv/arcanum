name: arcanum
description: "Arcanum - a precision Magic: The Gathering collection vault with on-device price analytics."
publish_to: 'none'
version: 1.14.0+24

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  path: ^1.9.1
  cached_network_image: ^4.0.0
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  collection: ^1.19.1
  url_launcher: ^6.3.2
  dynamic_color: ^2.1.0
  flutter_svg: ^2.3.0
  crypto: ^3.0.7
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  file_picker: ^12.3.0
  package_info_plus: ^10.2.1
  workmanager: ^0.10.10
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
