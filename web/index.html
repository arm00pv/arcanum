<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Arcanum - a precision Magic: The Gathering collection vault with on-device price analytics.">

  <!-- iOS meta tags & icons -->
  <!--
    The app is handed over as a home screen web app rather than a bookmark. iOS
    treats a home screen web app as something other than Safari, which is what
    spares the local catalogue the seven-day cap Safari puts on script-writable
    storage, and what opens the app without Safari's chrome around it. iOS 11.3
    and later take the display mode from the manifest; the prefixed tag is what
    the versions before that read.
  -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcanum">
  <!--
    Black rather than black-translucent. Nothing in Flutter's web rendering
    reads the safe-area insets, so a status bar the app were allowed to draw
    under would put its own bars beneath the clock with no way to inset them.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    What colours the status bar of an installed iOS app, from iOS 15 on. The
    app's own overlay style is dark and carries no colour, so this is the one
    that shows.
  -->
  <meta name="theme-color" content="#07070C">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Arcanum</title>
  <link rel="manifest" href="manifest.json">

  <!--
    No viewport meta tag, and that is deliberate - see docs/web-on-ios.md.
    Flutter's web engine deletes any viewport tag it is given and writes its own
    without viewport-fit, and nothing in its rendering reads
    env(safe-area-inset-*). So viewport-fit=cover would change nothing today,
    and would be wrong if only one half of that ever changed. With viewport-fit
    absent, iOS keeps the page inside the safe area, which is where the app
    already lays itself out.
  -->

  <!--
    The colour behind everything: the strips a notched iPhone holds back from
    the viewport, and the moment before Flutter has painted anything. Both are
    white without this - a flash on launch, and a bright frame around a dark
    app.
  -->
  <style>
    html,
    body {
      background-color: #07070C;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
